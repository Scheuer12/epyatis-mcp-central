name: Documentation improvement
description: Report missing, unclear or incorrect documentation.
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Document or location
      placeholder: README.md, section Quick start
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: A draft is welcome but not required.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing documentation issues.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true

