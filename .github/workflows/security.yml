name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CENTRAL_ENV: testing
      CENTRAL_SECRET_KEY: ci-test-secret-key-with-at-least-32-characters
      CENTRAL_ADMIN_KEY: ci-test-admin-key-with-at-least-32-characters
      PERISKOPE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned audit tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Static security analysis
        run: bandit -q -r src/central -ll
      - name: Audit pinned dependencies and produce SBOM
        run: pip-audit --requirement requirements.txt --strict --format cyclonedx-json --output sbom.cdx.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn
