name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      CENTRAL_ENV: testing
      CENTRAL_SECRET_KEY: ci-test-secret-key-with-at-least-32-characters
      CENTRAL_ADMIN_KEY: ci-test-admin-key-with-at-least-32-characters
      DATABASE_URL: "sqlite:///:memory:"
      PERISKOPE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Reject syntax and undefined-name errors
        run: ruff check src tests
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run hermetic security regression suite
        run: python -m pytest -p no:cacheprovider tests/test_security_*.py -q
