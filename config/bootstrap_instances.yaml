# Generic development bootstrap. No credentials or organization-specific IDs.
instances:
  - id: "demo-suite"
    name: "Demo MCP Suite"
    slug: "demo-suite"
    description: "Local development instance with diagnostic tools only."
    visibility: "private"
    data_sources_map:
      organization: "Example Organization"
      sources:
        - id: "example.knowledge.base"
          name: "Example Knowledge Base"
          description: "Fictitious source used to demonstrate the registry schema."
          purpose: "documentation"
          system: "internal"
          tags: ["example", "documentation"]
          authority: "example"
          status: "inactive"
          resource_type: "collection"
          primary_tools: ["central__ping"]
          guidance: "Replace this example with an authorized source in your own deployment."
    connections:
      - id: "internal"
        enabled: true
        type: "internal"
        prefix: "central"
